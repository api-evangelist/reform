name: Reform Rate Limits
generated: '2026-08-14'
method: searched
source: >-
  https://docs.reform.app/ (full help-centre search for "rate limit", "limit",
  "API", "quota" — no result), https://www.reform.app/pricing,
  https://docs.reform.app/article/7-webhooks
version: '0.2'
url: https://docs.reform.app/
description: >-
  Reform publishes NO rate limits. There is no public REST API to limit, no
  documented throttle on form submission or webhook delivery, no published
  response headers, and no documented status code on exhaustion. This file
  records that absence. It replaces a prior round's version that asserted a
  token-bucket strategy, HTTP 429 enforcement and API-key/OAuth/Basic
  authentication — none of which appears anywhere in Reform's documentation and
  none of which could be reproduced by probe. Only the plan-level quotas Reform
  does publish, and the third-party limits its integrations inherit, are kept.
limit_count: 0
headers_published: false
exhaustion_status_code: null
retry_after: not published

limits: []

published_quotas:
  - name: Form responses
    scope: account
    value: unlimited
    source: https://www.reform.app/pricing
    note: >-
      "All plans include unlimited responses" — stated on the pricing page and
      repeated on the Basic and Pro tiers. A quota, not a rate limit.
  - name: Form publishing
    scope: account
    value: 0 on the Free plan
    source: https://www.reform.app/pricing
    note: >-
      Free-plan forms can be built but cannot be published or shared publicly,
      so the effective submission rate on Free is zero.
  - name: Team members
    scope: account
    value: 1 on Free and Basic; unlimited on Pro
    source: https://www.reform.app/pricing
  - name: Webhook destinations
    scope: per form
    value: not published
    source: https://docs.reform.app/article/7-webhooks
    note: >-
      Multiple destinations are supported ("the URLs in the Active webhooks
      list"); no maximum is stated. Webhooks are a Pro-plan feature.

webhook_delivery:
  retries_published: false
  timeout_published: false
  backoff_published: false
  note: >-
    Reform's marketing page claims "robust error handling" and "reliable data
    delivery ... even at high volumes"; the documentation states no retry
    schedule, no delivery timeout and no dead-letter behaviour. Consumers should
    dedupe on the event `id`.
  source: https://docs.reform.app/article/7-webhooks

inherited_third_party_limits:
  note: >-
    Reform's outbound integrations are rate-limited by the DOWNSTREAM platform,
    not by Reform. These are the third party's limits, recorded so an integrator
    knows where the ceiling actually is.
  platforms:
    - {name: HubSpot, limit_type: per-second and daily, authority: HubSpot}
    - {name: Salesforce, limit_type: per-day API request allocation, authority: Salesforce, status: integration listed "coming soon"}
    - {name: Zapier, limit_type: task-based, authority: Zapier plan}
    - {name: Google Sheets, limit_type: per-minute read/write quotas, authority: Google}
    - {name: Close, limit_type: per-second, authority: Close}
    - {name: Slack, limit_type: per-method tier, authority: Slack}

gaps:
  - No rate limit of any kind is documented for Reform's own surfaces.
  - No X-RateLimit-*, RateLimit-* or Retry-After headers are documented, and none could be observed — there is no unauthenticated Reform endpoint to observe them on.
  - No abuse/anti-spam throughput policy is published; spam control is delegated to customer-supplied Google reCAPTCHA keys and Reform's email-validation features.
