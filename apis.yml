apis:
  - name: Reform Forms
    description: Reform's public integration surface. It is not a REST management API — no endpoint exists to create, read or update forms and submissions. What Reform publishes is the hosted form host (forms.reform.app), which serves published forms and receives headless HTML form POSTs using answers[block-id] field naming, plus a signed form.submitted webhook delivered to destinations configured per form, and a browser embed loader at embed.reform.app/v1/embed.js exposing six parent-page events. Webhooks and custom code require the Pro plan.
